# Ansible 從台灣控制節點讀取本清單；只記已存在且已確認連線的 VM。
# 這裡沒有密鑰內容，也不會因讀取 inventory 而修改任何節點。
all:
  children:
    controller:
      hosts:
        instance-20260923-104239:
          # 控制節點就是執行 Ansible 的本機，不需要再經 SSH 連回自己。
          ansible_connection: local
    gpu_compute:
      hosts:
        compute-gpu01:
          # 從控制節點經私有網路，以既有帳號與專用金鑰登入 GPU VM。
          ansible_host: 10.146.0.3
          ansible_user: a2264
          ansible_ssh_private_key_file: /home/a2264/.ssh/hpc_gpu_ed25519
