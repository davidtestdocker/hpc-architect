# 從台灣控制節點讀取的 YAML inventory；縮排表示隸屬關係，# 註解不影響執行。
# 只列已存在的兩台 VM；清單只描述目標和連線方式，讀取時不會修改節點。
# all、children、hosts 和下方使用的 ansible_* 連線變數是 Ansible 認得的名稱；
# controller、gpu_compute 與下面的主機別名是這個專案自行取的名稱。
# 上次輸出的 ungrouped 也是內建群組，收錄未放進自訂群組的主機；本檔沒有。

# all 是 Ansible 內建的總群組；清單中的每台主機都屬於 all，名稱不能隨意改。
all:
  # children 是 YAML inventory 的固定欄位，表示 all 下面有哪些子群組。
  children:
    # controller 是自訂群組名，代表控制節點；改名時相關 playbook 目標也要一起改。
    controller:
      # hosts 是固定欄位，下面列出屬於 controller 群組的主機。
      hosts:
        # 這是自訂的主機別名，選用實際主機名，方便在輸出中辨認。
        instance-20260923-104239:
          # ansible_connection 是固定連線變數；local 表示在執行 Ansible 的控制節點本機操作。
          ansible_connection: local
    # gpu_compute 也是自訂群組名，代表 GPU 運算節點；不是 Ansible 固定關鍵字。
    gpu_compute:
      # 這個 hosts 與上面相同，表示此群組有哪些主機。
      hosts:
        # compute-gpu01 是自訂主機別名；真正連線位址由 ansible_host 決定。
        compute-gpu01:
          # ansible_host 是固定連線變數；這裡使用 GPU VM 已確認的私有 IP。
          ansible_host: 10.146.0.3
          # ansible_user 是固定連線變數；SSH 以既有工作帳號登入 GPU VM。
          ansible_user: a2264
          # ansible_ssh_private_key_file 是固定連線變數；只記私鑰路徑，不複製私鑰內容。
          ansible_ssh_private_key_file: /home/a2264/.ssh/hpc_gpu_ed25519
