---
# 從台灣控制節點透過 inventory 的 SSH 連線，管理東京 GPU VM 的 NFS 掛載。
# 控制節點先依 requirements.yml 安裝 ansible.posix:2.2.2。
# 套用前先預演；正式套用會寫入 GPU VM 的 /etc/fstab 並確保目前已掛載。
- name: 設定 GPU VM 的 NFS 工作資料掛載
  hosts: gpu_compute
  become: true  # 安裝套件、寫入 /etc/fstab 和掛載都需要管理員權限。
  tasks:
    # 乾淨節點須先有 NFS 用戶端工具；現有 GPU VM 已在模組 04 安裝。
    - name: 確保 NFS 用戶端套件已安裝
      ansible.builtin.package:
        name: nfs-utils
        state: present

    # src 是控制節點的私有 IP 與已匯出的目錄；path 是 GPU VM 使用的路徑。
    # mounted 會建立缺少的掛載目錄、寫入 /etc/fstab，並確保目前已掛載。
    # backup 保留修改前的 fstab，供非預期變更時比對或復原。
    # vers=4.2 沿用模組 04 實測版本；_netdev 表示需網路；nofail 避免分享不可達時阻斷開機。
    - name: 確保控制節點的 NFS 分享已掛載
      ansible.posix.mount:
        src: 10.140.0.2:/srv/hpc-share
        path: /srv/hpc-share
        fstype: nfs
        opts: vers=4.2,_netdev,nofail
        backup: true
        state: mounted
