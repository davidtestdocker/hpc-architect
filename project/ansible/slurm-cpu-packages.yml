---
# 從控制節點工作樹執行，只管理 inventory 的 AlmaLinux CPU 客體。
# 複製既有 el10 RPM 並安裝套件；不編譯、不複製 MUNGE 金鑰，也不啟動服務。
- name: 安裝 CPU 客體的 MUNGE 與同版 Slurm RPM
  hosts: cpu_compute
  become: true
  gather_facts: false
  vars:
    # 這是客體上的安裝檔暫存位置，來源仍是控制節點的 project/packages/slurm。
    slurm_rpm_dir: /var/tmp/hpc-slurm-rpms
    slurm_rpm_files:
      - slurm-26.05.4-1.el10.x86_64.rpm
      - slurm-slurmd-26.05.4-1.el10.x86_64.rpm
  tasks:
    - name: 建立客體上的 RPM 暫存目錄
      ansible.builtin.file:
        path: "{{ slurm_rpm_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # loop 依清單逐一複製；只在來源內容不同時更新客體檔案。
    - name: 從控制節點複製已保存的 Slurm RPM
      ansible.builtin.copy:
        src: "../packages/slurm/{{ item }}"
        dest: "{{ slurm_rpm_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ slurm_rpm_files }}"

    # MUNGE 來自 AlmaLinux AppStream，保留倉庫預設的 GPG 驗證。
    - name: 從 AlmaLinux 倉庫安裝 MUNGE
      ansible.builtin.dnf:
        name: munge
        state: present

    # 兩個本地 RPM 已由工作樹 SHA256SUMS 核對，但沒有 RPM 簽章；
    # disable_gpg_check 只用在這個安裝任務，DNF 仍處理所需的相依套件。
    - name: 安裝同版 Slurm 共用元件與運算服務
      ansible.builtin.dnf:
        name:
          - "{{ slurm_rpm_dir }}/slurm-26.05.4-1.el10.x86_64.rpm"
          - "{{ slurm_rpm_dir }}/slurm-slurmd-26.05.4-1.el10.x86_64.rpm"
        state: present
        disable_gpg_check: true

    # 版本查詢不變更系統；輸出只作套件安裝證據，不代表服務已啟動。
    - name: 核對客體已安裝的 MUNGE 與 Slurm 版本
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - --qf
          - "%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\\n"
          - munge
          - slurm
          - slurm-slurmd
      register: cpu_package_versions
      changed_when: false

    - name: 顯示客體套件版本
      ansible.builtin.debug:
        var: cpu_package_versions.stdout_lines
