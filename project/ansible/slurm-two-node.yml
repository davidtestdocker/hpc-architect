---
# 從台灣控制節點的 project/ansible 目錄執行；ansible.cfg 讀取兩台已存在 VM 的 inventory。
# 前置條件：GPU VM 已安裝同版 Slurm、MUNGE 已跨節點驗證；本檔不建立 VM、帳號或安裝套件。
# 只有從此目錄正式執行 ansible-playbook slurm-two-node.yml 時，下面的 copy 才會複製檔案；
# --syntax-check 只檢查語法，--check --diff 只預演，兩者都不會把檔案複製到 VM。
# 來源是控制節點工作樹中的 ../slurm/two-node-slurm.conf；正式執行時，先複製到
# GPU VM 自己的 /etc/slurm/slurm.conf，通過 slurmd -G 後才複製到控制節點自己的同名路徑。
# 兩台各有一份檔案，不是共用一個磁碟檔案；目前尚未正式執行此 playbook。
# 模組 01 已用 install -D 在控制節點建立 /etc/slurm/slurm.conf，內容來自
# project/slurm/single-node-slurm.conf；本 playbook 正式執行時會以兩節點版取代它。
# GPU VM 的 /etc/slurm 是否已由套件建立尚未核對，下方 file 任務會處理。
# 執行順序：先備妥 GPU 設定並檢查 GRES，再更新控制端設定，最後啟動 GPU VM 的 slurmd。
- name: 備妥 GPU VM 的 Slurm 設定並檢查 GPU 對應
  hosts: gpu_compute
  become: true
  any_errors_fatal: true  # 這台 VM 設定失敗時，停止後續控制端變更。
  tasks:
    # 若 /etc/slurm 不存在就建立；若已存在則核對目錄屬性，不代表此前已存在。
    # 下方 copy 需要此目錄，才能把設定寫成 /etc/slurm/slurm.conf 與 gres.conf。
    - name: 建立或核對 GPU VM 的 /etc/slurm 目錄
      ansible.builtin.file:
        path: /etc/slurm
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 確保 GPU VM 的工作暫存目錄存在
      ansible.builtin.file:
        path: /var/spool/slurmd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # 兩台 VM 要使用相同的 slurm.conf；backup 在檔案改動時留存遠端舊版。
    # register 保存這項任務是否變更，供最後一個 play 決定是否重啟 slurmd。
    - name: 部署 GPU VM 的共用 Slurm 設定
      ansible.builtin.copy:
        src: ../slurm/two-node-slurm.conf
        dest: /etc/slurm/slurm.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: gpu_slurm_config_result

    # 這項 copy 把控制節點工作樹中的 ../slurm/gpu-gres.conf 複製到 GPU VM 的
    # /etc/slurm/gres.conf；只在正式執行 playbook 時發生，控制節點不需要這份檔案。
    # AutoDetect=nvidia 指定 GPU VM 的 slurmd 使用哪種 NVIDIA 裝置偵測方式；
    # 它不是 GPU 驅動開關，部署前 slurmd -C 已探測到一張 L4。
    - name: 部署 GPU VM 的 GPU 資源設定
      ansible.builtin.copy:
        src: ../slurm/gpu-gres.conf
        dest: /etc/slurm/gres.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: gpu_gres_config_result

    # 在 GPU VM 執行 slurmd -G：讀當地 /etc/slurm/slurm.conf 的 GPU 宣告，
    # 以及同目錄 gres.conf 的 AutoDetect=nvidia，列出合併後的 GPU 資源並退出。
    # 它不啟動 slurmd 服務、不提交工作；changed_when 避免把查詢當成變更。
    # register 收集實際輸出；failed_when 遇到錯誤或找不到預期 L4 時停止後續控制端變更。
    # 預演時 command 不會執行，因此正式套用仍須看此任務的實際輸出。
    - name: 核對 GPU VM 的 GRES 設定
      ansible.builtin.command: slurmd -G
      register: gpu_gres_probe
      changed_when: false
      failed_when: >-
        gpu_gres_probe.rc != 0 or
        'nvidia_l4' not in (gpu_gres_probe.stdout ~ gpu_gres_probe.stderr) or
        'error:' in ((gpu_gres_probe.stdout ~ gpu_gres_probe.stderr) | lower)

- name: 讓控制節點認得 GPU VM
  hosts: controller
  become: true
  any_errors_fatal: true  # 控制端無法讀取新設定時，不繼續啟動 GPU VM 的 slurmd。
  tasks:
    # copy 真有變更時才 notify；handler 在本 play 結尾執行。
    - name: 部署控制節點的共用 Slurm 設定
      ansible.builtin.copy:
        src: ../slurm/two-node-slurm.conf
        dest: /etc/slurm/slurm.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: 重新讀取 Slurm 設定

  handlers:
    # scontrol reconfigure 請現有 Slurm 服務重新讀取設定；不執行 systemctl restart。
    - name: 重新讀取 Slurm 設定
      ansible.builtin.command: scontrol reconfigure

- name: 啟動 GPU VM 的 Slurm 運算服務
  hosts: gpu_compute
  become: true
  tasks:
    # when 在上述任一 copy 真有變更時才觸發重啟，讓已運行的 slurmd 讀入新設定。
    # 第一次套用時若服務尚未啟動，restarted 會啟動它；下一項任務確認開機自動啟動。
    - name: 設定有變更時重啟 GPU VM 的 slurmd
      ansible.builtin.service:
        name: slurmd
        state: restarted
      when: gpu_slurm_config_result.changed or gpu_gres_config_result.changed

    # 重跑且設定未變時，started 不會重啟服務；enabled 確保 VM 重開機後可運行。
    - name: 確保 GPU VM 的 slurmd 已啟動
      ansible.builtin.service:
        name: slurmd
        state: started
        enabled: true
