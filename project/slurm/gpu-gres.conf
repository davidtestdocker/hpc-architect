# 這是 GPU VM 的 GPU 偵測設定來源，目前只存在於專案，尚未部署。
# 正式執行 project/ansible/slurm-two-node.yml 時，Ansible 才會把它複製成
# compute-gpu01 的 /etc/slurm/gres.conf；控制節點不需要這份檔案。
# GPU VM 上的 slurmd 會讀同目錄的 slurm.conf 和 gres.conf：
# slurm.conf 用 Gres=gpu:nvidia_l4:1 宣告預計分配一張 L4；
# 下方 AutoDetect=nvidia 則讓 slurmd 偵測本機 NVIDIA GPU 與裝置資訊。
# 複製後，playbook 先在 GPU VM 執行 slurmd -G，印出兩份設定合併後的
# GPU 資源結果並退出；通過後才更新控制節點設定、啟動 GPU VM 的 slurmd 服務。
# slurmd -G 是設定檢查，不會啟動常駐服務或執行 GPU 工作。
# nvidia 偵測方式已由 slurmd -C 探測到一張 L4，但尚未用新設定執行 slurmd -G。
# 此方式不偵測 MIG 或 NVLink，也不能憑設定檢查宣稱工作已能使用 GPU。
AutoDetect=nvidia
