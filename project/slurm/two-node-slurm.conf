# 這是尚未部署的兩節點設定來源。project/ansible/slurm-two-node.yml 會把它
# 分別複製到控制節點與 GPU VM 各自的 /etc/slurm/slurm.conf；「共用」指內容相同，
# 不是共用 NFS 上同一個檔案。控制節點原有單節點設定會在部署時被更新。
# 控制節點的 slurmctld 排工作，GPU VM 的 slurmd 接工作。
# ClusterName 是 Slurm 辨識這個叢集的名稱，不是 GCP 專案或 VM 名稱。
# hpc_lab 直接沿用 project/slurm/single-node-slurm.conf 的既有名稱；
# 兩台 VM 必須使用同一名稱，這一行本身不會建立雲端叢集或 VM。
ClusterName=hpc_lab

# SlurmctldHost 指定執行排程控制服務 slurmctld 的主機。
# 主機名沿用單節點設定；括號內 10.140.0.2 是控制節點的私有 IP，
# 供其他節點連回控制服務，不是 GPU VM 的位址。
SlurmctldHost=instance-20260923-104239(10.140.0.2)

# SlurmUser 是執行控制服務的既有系統帳號；不是提交工作的使用者。
SlurmUser=slurm
# AuthType 指定節點與控制服務用 MUNGE 驗證彼此身分；
# 兩台 VM 已使用同一把 MUNGE 金鑰，並成功跨節點解碼憑證。
AuthType=auth/munge
# CredType 指定 Slurm 工作執行憑證也使用 MUNGE，讓運算節點
# 能核對工作確實由這個控制服務分派；沿用原單節點設定。
CredType=cred/munge

# StateSaveLocation 是控制節點上 slurmctld 保存佇列與節點狀態的目錄路徑；
# /var/spool/slurmctld 是既有控制節點上的目錄，不是安裝位置或 NFS 共享路徑。
StateSaveLocation=/var/spool/slurmctld
# SlurmdSpoolDir 是每台執行 slurmd 的節點各自使用的本機暫存目錄路徑，
# 不是 slurmd 的安裝位置；playbook 會在 GPU VM 建立或核對此目錄。
SlurmdSpoolDir=/var/spool/slurmd

# SelectType=select/cons_tres 讓排程器按可消耗資源分配工作。
# CR_CPU_Memory 表示 CPU 與記憶體都按請求量計入分配；
# 這是沿用單節點設定，不等於已啟用核心層的記憶體隔離。
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
# GresTypes 告訴 Slurm 這個叢集會管理 gpu 類型的額外資源；
# 實際 GPU 數量在下方 GPU 節點的 Gres 宣告，裝置由該節點的 gres.conf 對應。
GresTypes=gpu

# NodeName 是 Slurm 的節點名稱；NodeAddr 是控制服務連到該節點的私有 IP。
# 控制節點的 CPUs=2、Sockets=1、CoresPerSocket=1、ThreadsPerCore=2
# 與 RealMemory=3000 MiB 直接沿用既有 single-node-slurm.conf。
# State=UNKNOWN 是載入設定時的初始狀態，之後由 slurmd 註冊更新。
NodeName=instance-20260923-104239 NodeAddr=10.140.0.2 CPUs=2 Sockets=1 CoresPerSocket=1 ThreadsPerCore=2 RealMemory=3000 State=UNKNOWN

# GPU 節點的名稱、4 個邏輯 CPU、1 插槽、每插槽 2 核與每核 2 執行緒
# 來自 compute-gpu01 的 slurmd -C 實測；NodeAddr 是其私有 IP。
# 實測記憶體為 15983 MiB，這裡只宣告 14000 MiB 可供排程，
# 約留 2 GiB 給作業系統與服務；State=UNKNOWN 等服務註冊後更新。
# Gres=gpu:nvidia_l4:1 表示向排程器申報一張 L4；是否能對應實體裝置
# 仍須在 GPU VM 用 slurmd -G 及實際工作核對。
NodeName=compute-gpu01 NodeAddr=10.146.0.3 CPUs=4 Sockets=1 CoresPerSocket=2 ThreadsPerCore=2 RealMemory=14000 Gres=gpu:nvidia_l4:1 State=UNKNOWN

# PartitionName 是提交工作時選的佇列名稱；Nodes 列出此佇列可用的節點。
# debug 沿用既有單節點設定：只用控制節點，Default=YES 表示
# 未指定分區的工作預設進這裡；MaxTime=00:30:00 限時 30 分鐘。
# State=UP 表示分區開放接收工作，不保證節點已正常註冊。
PartitionName=debug Nodes=instance-20260923-104239 Default=YES MaxTime=00:30:00 State=UP
# gpu 是新增的佇列，只包含 compute-gpu01；Default=NO 表示工作須明確選它，
# 並在工作請求中指定 GPU 數量，才會占用 GPU 資源；同樣限時 30 分鐘。
PartitionName=gpu Nodes=compute-gpu01 Default=NO MaxTime=00:30:00 State=UP
